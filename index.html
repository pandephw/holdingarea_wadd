<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holding Area Weather Forecast - BMKG</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Highcharts Core & Modules -->
    <script src="https://cdn.jsdelivr.net/npm/highcharts@11/highcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highcharts@11/highcharts-more.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highcharts@11/modules/windbarb.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #1e1e1e; color: #fff; }
        .container { display: flex; flex-direction: column; gap: 20px; max-width: 1400px; margin: 0 auto; }
        
        /* Header BMKG */
        .bmkg-header { display: flex; align-items: center; gap: 20px; background: #2b2b2b; padding: 15px 25px; border-radius: 8px; border: 1px solid #444; }
        .bmkg-logo { width: 55px; height: auto; }
        .bmkg-text-container { display: flex; flex-direction: column; }
        .bmkg-title-top { font-size: 14px; color: #ccc; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
        .bmkg-title-bottom { font-size: 22px; font-weight: bold; color: #5bc0de; text-transform: uppercase; letter-spacing: 1px; }

        /* Peta */
        .map-section { width: 100%; position: relative; }
        #map { height: 450px; width: 100%; border-radius: 8px; border: 1px solid #444; z-index: 1; }
        
        /* Grafik Container */
        .chart-section { width: 100%; background: #2b2b2b; padding: 20px; border-radius: 8px; border: 1px solid #444; box-sizing: border-box; }
        .header-info { margin-bottom: 15px; }
        .header-info strong { color: #5bc0de; font-size: 1.2em; }
        
        /* Tombol Tab */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { background: #333; color: #ccc; border: 1px solid #555; padding: 10px 25px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .tab-btn.active { background: #5bc0de; color: #000; border-color: #5bc0de; }
        
        .chart-container { height: 500px; width: 100%; display: none; }
        .chart-container.active { display: block; }
        
        /* Tooltip Highcharts */
        .custom-tooltip { font-size: 12px; line-height: 1.6; color: #333; padding: 5px; }
        .custom-tooltip .time { font-weight: bold; border-bottom: 1px solid #ddd; margin-bottom: 5px; padding-bottom: 3px; display: block; }
        .custom-tooltip .desc { font-weight: bold; color: #0056b3; display: flex; align-items: center; gap: 5px; }

        /* Popup Peta Leaflet */
        .leaflet-popup-content-wrapper { background-color: #222; color: #eee; border-radius: 8px; padding: 0; }
        .leaflet-popup-tip { background-color: #222; }
        .leaflet-popup-content { margin: 15px; min-width: 320px; }
        .leaflet-container a.leaflet-popup-close-button { color: #aaa; right: 10px; top: 10px; }
        .leaflet-container a.leaflet-popup-close-button:hover { color: #fff; }
        
        .info-row { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 4px; }
        
        /* Kotak Detail Cuaca (Kuning) */
        .weather-summary-box { background-color: #ffe699; color: #333; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 12px; display: flex; align-items: center; gap: 12px; }
        .weather-summary-box .weather-icon-wrapper { text-align: center; min-width: 75px; }
        .weather-summary-box .weather-icon-wrapper img { width: 45px; height: 45px; background: #444; border-radius: 50%; padding: 2px; }
        .weather-summary-box .cond { font-weight: bold; font-size: 12px; margin-top: 5px; color: #000; line-height: 1.2; }
        .weather-summary-box .fl-container { flex-grow: 1; border-left: 1px solid #d6b85a; padding-left: 12px; }
        .weather-summary-box .fl-info { margin-bottom: 5px; font-weight: 600; display: flex; align-items: center; }
        .weather-summary-box .fl-info:last-child { margin-bottom: 0; }

        /* Blok Warna Risiko */
        .bg-green { background-color: #5cb85c; }
        .bg-yellow { background-color: #f0ad4e; }
        .bg-orange { background-color: #fd7e14; }
        .bg-red { background-color: #d9534f; }
        .bg-gray { background-color: #555; }
        
        .risk-block { flex: 1; height: 24px; border-radius: 3px; margin: 0 1px; }
        .risk-label { flex: 1; text-align: center; font-size: 9px; color: #aaa; margin-top: 3px; }
        
        .legend-container { display: flex; gap: 8px; font-size: 10px; color: #aaa; margin-top: 15px; flex-wrap: wrap; padding-bottom: 5px;}
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-color { width: 10px; height: 10px; border-radius: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div class="bmkg-header">
        <img src="logo-bmkg.png" onerror="this.src='https://www.bmkg.go.id/asset/img/logo/logo-bmkg.png'" alt="Logo BMKG" class="bmkg-logo">
        <div class="bmkg-text-container">
            <div class="bmkg-title-top">Stasiun Meteorologi Kelas I</div>
            <div class="bmkg-title-bottom">I Gusti Ngurah Rai</div>
        </div>
    </div>

    <div class="map-section">
        <div id="map"></div>
    </div>

    <div class="chart-section" id="chartSection">
        <div class="header-info">
            Lokasi: <strong id="locationName">Pilih titik di peta untuk melihat detail</strong>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('meteogram')">Meteogram</button>
            <button class="tab-btn" onclick="switchTab('airgram')">Airgram</button>
        </div>

        <div id="meteogram" class="chart-container active"></div>
        <div id="airgram" class="chart-container"></div>
    </div>
</div>

<script>
    // 1. DATA KOORDINAT WAYPOINT TERBARU
    const waypoints = [
        { name: "BEPTA", lat: -8.01278, lon: 114.7117, sector: "Sektor Barat Laut", fls: [{level: 500, label: 'FL180'}, {level: 400, label: 'FL240'}] },
        { name: "ESKOG", lat: -8.41694, lon: 114.7028, sector: "Sektor Barat", fls: [{level: 850, label: 'FL050'}, {level: 700, label: 'FL100'}] },
        { name: "GODEV", lat: -8.915, lon: 114.4214, sector: "Sektor Barat (Pendekatan Utama)", fls: [{level: 700, label: 'FL100'}, {level: 500, label: 'FL180'}, {level: 400, label: 'FL240'}] },
        { name: "GOSAN", lat: -9.05333, lon: 114.9836, sector: "Sektor Barat Daya (Aktif RWY 27)", fls: [{level: 700, label: 'FL100'}, {level: 500, label: 'FL180'}] },
        { name: "IDGON", lat: -9.26556, lon: 115.1614, sector: "Sektor Barat Daya Luar", fls: [{level: 700, label: 'FL100'}, {level: 500, label: 'FL180'}] },
        { name: "VIDIL", lat: -7.50944, lon: 115.1217, sector: "Sektor Timur Laut", fls: [{level: 500, label: 'FL180'}, {level: 400, label: 'FL240'}] },
        { name: "MAGUR", lat: -8.28028, lon: 115.1667, sector: "Sektor Timur", fls: [{level: 700, label: 'FL100'}, {level: 500, label: 'FL180'}] },
        { name: "BENOA", lat: -8.73917, lon: 115.3983, sector: "Sektor Timur (Khusus RWY 27)", fls: [{level: 850, label: 'FL050'}] },
        { name: "KHUTA", lat: -8.75467, lon: 114.9109, sector: "Sektor Timur (Khusus RWY 09)", fls: [{level: 850, label: 'FL050'}] },
        { name: "SARAV", lat: -9.05694, lon: 115.8097, sector: "Sektor Tenggara (Khusus RWY 27)", fls: [{level: 850, label: 'FL050'}, {level: 700, label: 'FL100'}] },
        { name: "MAVDU", lat: -9.05511, lon: 115.3406, sector: "Sektor Tenggara (Khusus RWY 09)", fls: [{level: 850, label: 'FL050'}, {level: 700, label: 'FL100'}] },
        { name: "LELES", lat: -9.31528, lon: 115.6603, sector: "Sektor Tenggara", fls: [{level: 400, label: 'FL240'}] },
        { name: "GUMKA", lat: -9.735, lon: 115.16, sector: "Sektor Selatan / Tenggara", fls: [{level: 500, label: 'FL180'}, {level: 400, label: 'FL240'}] }
    ];

    // INISIALISASI PETA
    const map = L.map('map').setView([-8.7, 115.2], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

    let currentWeatherData = null; 
    let currentWaypoint = null;
    let meteogramChart, airgramChart;

    // FUNGSI BANTUAN
    function getRiskLevel(wCode) {
        if (wCode >= 95 || wCode === 82) return 'bg-red'; 
        if ((wCode >= 63 && wCode <= 65) || (wCode >= 80 && wCode <= 81)) return 'bg-orange'; 
        if (wCode >= 45 && wCode <= 61 || wCode === 3) return 'bg-yellow'; 
        return 'bg-green'; 
    }

    function getCompassDirection(degree) {
        if (degree === undefined || degree === null) return '-';
        const val = Math.floor((degree / 22.5) + 0.5);
        const arr = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
        return arr[(val % 16)];
    }

    function getWindArrowSvg(degree) {
        return `<svg style="transform: rotate(${degree}deg); width: 14px; height: 14px; margin: 0 6px;" viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="2" x2="12" y2="22"></line>
                  <polyline points="19 9 12 2 5 9"></polyline>
                </svg>`;
    }

    function getWeatherDescEN(code) {
        if (code === 0) return 'Clear'; if (code === 1 || code === 2) return 'Partly Cloudy'; if (code === 3) return 'Cloudy'; if (code === 45 || code === 48) return 'Foggy'; if (code >= 51 && code <= 55) return 'Drizzle'; if (code >= 61 && code <= 65) return 'Light Rain'; if (code >= 80 && code <= 82) return 'Heavy Rain'; if (code >= 95) return 'Thunderstorm'; return 'Unknown';
    }

    function getWeatherIconUrl(code, timeStr) {
        const hour = new Date(timeStr).getHours();
        const suffix = (hour >= 6 && hour <= 17) ? 'd' : 'n';
        let icon = '01'; 
        if (code === 0) icon = '01'; else if (code === 1 || code === 2) icon = '02'; else if (code === 3) icon = '04'; else if (code === 45 || code === 48) icon = '50'; else if (code >= 51 && code <= 55) icon = '09'; else if (code >= 61 && code <= 65) icon = '10'; else if (code >= 71 && code <= 77) icon = '13'; else if (code >= 80 && code <= 82) icon = '09'; else if (code >= 95) icon = '11';
        return `https://openweathermap.org/img/wn/${icon}${suffix}.png`;
    }

    // MEMBUAT MARKER & POPUP
    waypoints.forEach(wp => {
        const marker = L.marker([wp.lat, wp.lon]).addTo(map);
        
        // BIND POPUP SEKALI SAJA UNTUK MENGHINDARI BUG KLIK
        marker.bindPopup(`<div style="text-align:center; padding: 20px;">Memuat informasi...</div>`);
        
        marker.on('click', async () => {
            // Ubah konten menjadi loading
            marker.setPopupContent(`<div style="text-align:center; padding: 20px;">Mengambil data cuaca...</div>`);
            
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${wp.lat}&longitude=${wp.lon}&hourly=temperature_2m,precipitation,weathercode,wind_speed_10m,wind_direction_10m,surface_pressure,wind_speed_200hPa,wind_direction_200hPa,wind_speed_300hPa,wind_direction_300hPa,wind_speed_400hPa,wind_direction_400hPa,wind_speed_500hPa,wind_direction_500hPa,wind_speed_700hPa,wind_direction_700hPa,wind_speed_850hPa,wind_direction_850hPa,wind_speed_925hPa,wind_direction_925hPa,wind_speed_1000hPa,wind_direction_1000hPa&wind_speed_unit=kn&timezone=auto&past_days=0&forecast_days=3&models=gfs_seamless`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                const data = await res.json();
                
                currentWeatherData = data;
                currentWaypoint = wp;

                const now = new Date().getTime();
                let startIndex = 0;
                for (let i = 0; i < data.hourly.time.length; i++) {
                    if (new Date(data.hourly.time[i]).getTime() > now) {
                        startIndex = i > 0 ? i - 1 : 0;
                        break;
                    }
                }

                // DATA UTAMA
                const currentWCode = data.hourly.weathercode[startIndex] ?? 0;
                const weatherText = getWeatherDescEN(currentWCode);
                const currentIconUrl = getWeatherIconUrl(currentWCode, data.hourly.time[startIndex]);
                
                // MENGOLAH FLIGHT LEVEL (DENGAN NULL CHECK)
                let flHtml = '';
                wp.fls.forEach(fl => {
                    const speedArray = data.hourly[`wind_speed_${fl.level}hPa`];
                    const dirArray = data.hourly[`wind_direction_${fl.level}hPa`];
                    
                    const speedVal = (speedArray && speedArray[startIndex] != null) ? Math.round(speedArray[startIndex]) : '-';
                    const dirDegree = (dirArray && dirArray[startIndex] != null) ? dirArray[startIndex] : null;
                    
                    const dirText = getCompassDirection(dirDegree);
                    const arrowSvg = dirDegree !== null ? getWindArrowSvg(dirDegree) : '';
                    
                    flHtml += `
                        <div class="fl-info">
                            <span style="width: 48px; display:inline-block; color:#0056b3;">${fl.label}</span> 
                            ${arrowSvg} ${speedVal} Kts (${dirText})
                        </div>`;
                });

                const weatherBoxHtml = `
                    <div class="weather-summary-box">
                        <div class="weather-icon-wrapper">
                            <img src="${currentIconUrl}" alt="weather icon">
                            <div class="cond">${weatherText}</div>
                        </div>
                        <div class="fl-container">
                            ${flHtml}
                        </div>
                    </div>
                `;

                // BLOK RISIKO CUACA
                let blocksHtml = ''; let labelsHtml = '';
                for (let i = 0; i < 12; i++) {
                    const dataIndex = startIndex + i;
                    const wCode = data.hourly.weathercode ? data.hourly.weathercode[dataIndex] : undefined;
                    const timeObj = data.hourly.time ? new Date(data.hourly.time[dataIndex]) : new Date();
                    const hourUTC = timeObj.getUTCHours().toString().padStart(2, '0');
                    
                    const riskClass = wCode !== undefined ? getRiskLevel(wCode) : 'bg-gray';
                    blocksHtml += `<div class="risk-block ${riskClass}"></div>`;
                    labelsHtml += `<div class="risk-label">${hourUTC}</div>`;
                }

                const popupHtml = `
                    <div style="margin-bottom: 12px; padding-right: 15px;">
                        <div style="font-size: 16px; font-weight: bold; color: #fff;">${wp.name}</div>
                        <div style="font-size: 11px; color: #aaa;">1 lapisan • ${wp.lat.toFixed(4)}&deg;, ${wp.lon.toFixed(4)}&deg;</div>
                    </div>
                    
                    <div style="font-size: 12px; color: #ccc; margin-bottom: 6px; border-top: 1px solid #444; padding-top: 10px;">
                        <span style="color:#a682ff;">●</span> Area Holding
                    </div>
                    <div style="font-weight: bold; margin-bottom: 2px; color: #fff;">${wp.name}</div>
                    <div style="font-size: 12px; color: #aaa; margin-bottom: 12px;">I Gusti Ngurah Rai - Denpasar</div>

                    <div class="info-row"><span>Sektor:</span> <span style="font-weight:bold; color:#5bc0de;">${wp.sector}</span></div>
                    <div class="info-row"><span>ICAO:</span> <span style="font-weight:bold; color:#fff;">WADD</span></div>
                    
                    ${weatherBoxHtml}

                    <div style="margin-top: 15px; font-weight: bold; font-size: 11px; color: #fff;">Risk Forecast (UTC)</div>
                    <div style="display: flex; margin-top: 6px;">${blocksHtml}</div>
                    <div style="display: flex; margin-top: 2px;">${labelsHtml}</div>
                    
                    <div class="legend-container">
                        <div class="legend-item"><div class="legend-color bg-green"></div> Good</div>
                        <div class="legend-item"><div class="legend-color bg-yellow"></div> Low risk</div>
                        <div class="legend-item"><div class="legend-color bg-orange"></div> Med risk</div>
                        <div class="legend-item"><div class="legend-color bg-red"></div> High risk</div>
                    </div>
                `;

                // TIMPA KONTEN POPUP DENGAN DATA
                marker.setPopupContent(popupHtml);
                
                // LOAD GRAFIK SECARA OTOMATIS
                loadCharts();

            } catch (err) {
                console.error("Error memuat popup:", err);
                marker.setPopupContent(`<div style="color:#d9534f; padding: 10px; font-size:12px;">Data satelit tidak tersedia untuk koordinat ini.<br><br>Detail: ${err.message}</div>`);
            }
        });
    });

    // FUNGSI RENDER CHART HIGHCHARTS
    window.loadCharts = function() {
        if (!currentWeatherData || !currentWaypoint) return;
        document.getElementById('locationName').innerText = `${currentWaypoint.name} (${currentWaypoint.lat.toFixed(4)}, ${currentWaypoint.lon.toFixed(4)})`;
        renderMeteogram(currentWeatherData.hourly);
        renderAirgram(currentWeatherData.hourly);
        document.getElementById('chartSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    window.switchTab = function(tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.chart-container').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
        if(meteogramChart) meteogramChart.reflow();
        if(airgramChart) airgramChart.reflow();
    };

    function getWeatherDescID(code) {
        if (code === 0) return 'Cerah'; if (code === 1) return 'Cerah Berawan'; if (code === 2) return 'Berawan Sebagian'; if (code === 3) return 'Berawan'; if (code === 45 || code === 48) return 'Berkabut'; if (code >= 51 && code <= 55) return 'Gerimis'; if (code >= 61 && code <= 65) return 'Hujan'; if (code >= 80 && code <= 82) return 'Hujan Deras'; if (code >= 95) return 'Badai Petir'; return 'Tidak Diketahui';
    }

    Highcharts.setOptions({
        chart: { backgroundColor: 'transparent', style: { fontFamily: 'sans-serif' } },
        title: { text: null }, credits: { enabled: false },
        xAxis: { type: 'datetime', labels: { style: { color: '#aaa' } } },
        legend: { itemStyle: { color: '#ccc' } },
        time: { useUTC: false }
    });

    function renderMeteogram(hourly) {
        const timeData = hourly.time.map(t => new Date(t).getTime());
        const tempData = timeData.map((t, i) => {
            const iconUrl = getWeatherIconUrl(hourly.weathercode[i], hourly.time[i]);
            return {
                x: t, y: hourly.temperature_2m[i], weatherCode: hourly.weathercode[i], pressure: hourly.surface_pressure[i],
                iconImg: iconUrl, marker: { symbol: `url(${iconUrl})`, width: 32, height: 32 }
            };
        });
        const rainData = timeData.map((t, i) => [t, hourly.precipitation[i]]);
        const windData = timeData.map((t, i) => ({ x: t, value: hourly.wind_speed_10m[i], direction: hourly.wind_direction_10m[i] }));

        if (meteogramChart) meteogramChart.destroy();
        meteogramChart = Highcharts.chart('meteogram', {
            yAxis: [
                { title: { text: 'Suhu (°C)', style: { color: '#ff9800' } }, top: '0%', height: '55%', maxPadding: 0.2, gridLineColor: '#444', labels: { style: { color: '#aaa' } } }, 
                { title: { text: 'Hujan (mm)', style: { color: '#4fc3f7' } }, top: '60%', height: '25%', min: 0, gridLineColor: '#444', labels: { style: { color: '#aaa' } } },
                { title: { text: null }, top: '85%', height: '15%', gridLineWidth: 0, labels: { enabled: false } }
            ],
            tooltip: { 
                shared: true, useHTML: true, backgroundColor: 'rgba(255, 255, 255, 0.95)',
                formatter: function () {
                    let tempPoint = this.points.find(p => p.series.name === 'Suhu'); let rainPoint = this.points.find(p => p.series.name === 'Curah Hujan'); let windPoint = this.points.find(p => p.series.name === 'Angin Permukaan');
                    let timeStr = Highcharts.dateFormat('%d/%m/%Y %H:%M', this.x) + ' Lokal';
                    let wCode = tempPoint ? tempPoint.point.weatherCode : 0; let iconImg = tempPoint ? tempPoint.point.iconImg : ''; let desc = getWeatherDescID(wCode);
                    let temp = tempPoint ? tempPoint.y.toFixed(1) : '-'; let rain = rainPoint ? rainPoint.y.toFixed(1) : '0'; let press = tempPoint ? tempPoint.point.pressure.toFixed(0) : '-'; let wSpeed = windPoint ? windPoint.point.value : '-'; let wDir = windPoint ? windPoint.point.direction : '-';
                    return `<div class="custom-tooltip"><span class="time">${timeStr}</span><span class="desc"><img src="${iconImg}" style="width:28px; height:28px; background:#444; border-radius:50%;"> ${desc}</span><br/><span style="color:#d9534f">🌡️ Suhu: ${temp}°C</span><br/><span style="color:#5bc0de">💧 Hujan: ${rain} mm</span><br/><span style="color:#f0ad4e">⏱️ Tekanan: ${press} hPa</span><br/><span style="color:#5cb85c">💨 Angin: ${wSpeed} KT @ ${wDir}°</span></div>`;
                }
            },
            series: [
                { name: 'Suhu', type: 'spline', data: tempData, color: '#ff9800', zIndex: 2, yAxis: 0, dataLabels: { enabled: true, format: '{y}°', style: { color: '#ff9800', textOutline: 'none', fontWeight: 'bold' }, y: -25 } },
                { name: 'Curah Hujan', type: 'column', data: rainData, color: '#4fc3f7', zIndex: 1, yAxis: 1 },
                { name: 'Angin Permukaan', type: 'windbarb', data: windData, color: '#fff', vectorLength: 12, yAxis: 2, yOffset: 0 }
            ]
        });
    }

    function renderAirgram(hourly) {
        const timeData = hourly.time.map(t => new Date(t).getTime());
        const levels = [1000, 925, 850, 700, 500, 400, 300, 200];
        const windSeries = levels.map(level => {
            return {
                name: `${level} hPa`, type: 'windbarb', color: '#fff', vectorLength: 12,
                data: timeData.map((t, i) => ({ x: t, y: level, value: hourly[`wind_speed_${level}hPa`][i], direction: hourly[`wind_direction_${level}hPa`][i] }))
            };
        });
        if (airgramChart) airgramChart.destroy();
        airgramChart = Highcharts.chart('airgram', {
            chart: { marginRight: 20 },
            yAxis: { title: { text: 'Tekanan (hPa)', style: { color: '#aaa' } }, reversed: true, tickPositions: levels, gridLineColor: '#555', labels: { style: { color: '#aaa' } } },
            tooltip: { formatter: function() { return `<b>${Highcharts.dateFormat('%d %b %H:%M', this.x)}</b><br/>Tekanan: ${this.y} hPa<br/>Angin: ${this.point.value} KT, ${this.point.direction}°`; } },
            plotOptions: { windbarb: { grouping: false, pointPlacement: 'on' } },
            series: windSeries
        });
    }
</script>

</body>
</html>
